<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="KBAN"/>
<title>KBAN Dashboard - Set Password</title>
<link rel="apple-touch-icon" sizes="180x180" href="/icon.png"/>
<link rel="icon" href="/icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
font-family:'IBM Plex Sans',sans-serif;
background:#0B2E4E;
display:flex;align-items:center;justify-content:center;
min-height:100vh;
padding:20px;
padding-top:env(safe-area-inset-top,20px);
}

.card{
background:#fff;
border-radius:16px;
padding:40px 36px;
width:100%;
max-width:400px;
box-shadow:0 8px 40px rgba(0,0,0,0.25);
}

.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.logo-mark{
width:44px;height:44px;
background:#2E83F0;border-radius:10px;
display:flex;align-items:center;justify-content:center;
flex-shrink:0;
}
.logo-mark svg{width:26px;height:26px;}
.logo-word{}
.logo-kban{font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;color:#0B2E4E;letter-spacing:0.02em;line-height:1;}
.logo-sub{font-size:10px;color:#9ab0c4;letter-spacing:0.12em;text-transform:uppercase;margin-top:2px;}

h1{font-size:20px;font-weight:600;color:#0B2E4E;margin-bottom:6px;}
.sub{font-size:14px;color:#5a7a96;margin-bottom:28px;}

label{display:block;font-size:12px;font-weight:600;color:#5a7a96;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;}
input[type=email],input[type=password]{
width:100%;
padding:12px 14px;
border:1.5px solid #d8e4ee;
border-radius:8px;
font-size:15px;
font-family:'IBM Plex Sans',sans-serif;
color:#0B2E4E;
background:#F5F7FA;
outline:none;
transition:border-color 0.15s;
margin-bottom:18px;
}
input[type=email]:focus,input[type=password]:focus{
border-color:#2E83F0;
background:#fff;
}
input[type=email]::placeholder,input[type=password]::placeholder{color:#b0c4d4;}

.btn{
width:100%;
padding:13px;
background:#2E83F0;
color:#fff;
border:none;
border-radius:8px;
font-size:15px;
font-weight:600;
font-family:'IBM Plex Sans',sans-serif;
cursor:pointer;
transition:background 0.15s,opacity 0.15s;
margin-top:4px;
}
.btn:hover{background:#1a6dd4;}
.btn:disabled{opacity:0.55;cursor:not-allowed;}

.error{
background:#fee2e2;
color:#b91c1c;
border-radius:8px;
padding:10px 14px;
font-size:13px;
margin-bottom:16px;
display:none;
}
.error.show{display:block;}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>

</head>
<body>
<div class="card">
<div class="logo">
<div class="logo-mark" style="background:none;padding:0;">
<img src="/icon.png" alt="KBAN" style="width:44px;height:44px;border-radius:10px;display:block;"/>
</div>
<div class="logo-word">
<div class="logo-kban">KBAN</div>
<div class="logo-sub">Logistics Dashboard</div>
</div>
</div>

<h1>Set your password</h1>
<p class="sub" id="sub">Checking your reset link.</p>

<div class="error" id="err"></div>

<form id="form" autocomplete="off" style="display:none">
<label for="pw1">New password</label>
<input type="password" id="pw1" placeholder="At least 10 characters" autocomplete="new-password" required/>

<label for="pw2">Confirm password</label>
<input type="password" id="pw2" placeholder="Type it again" autocomplete="new-password" required/>

<button class="btn" type="submit" id="btn">Save password</button>
</form>
<p class="sub" id="done" style="display:none;margin:20px 0 0">Password saved. <a href="/login.html" style="color:#2E83F0;font-weight:600">Go to sign in</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://eacaudjkppyhpsjzoakv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhY2F1ZGprcHB5aHBzanpvYWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDYwNzYsImV4cCI6MjA5ODEyMjA3Nn0.oxPp4xwKyt7MjeefQiC8zKApzwydlqst_GY1WyLVmxU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const form = document.getElementById('form');
const btn = document.getElementById('btn');
const err = document.getElementById('err');
const sub = document.getElementById('sub');
let ready = false;

function showForm() {
  if (ready) return;
  ready = true;
  sub.textContent = 'Choose a new password for your KBAN login.';
  form.style.display = 'block';
}
function showProblem(msg) {
  sub.textContent = '';
  err.textContent = msg;
  err.classList.add('show');
}

const hash = window.location.hash || '';
if (/error_description|error_code=otp_expired|error=access_denied/.test(hash)) {
  showProblem('This reset link has expired or has already been used. Ask the office for a new one.');
} else {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) showForm();
  });
  sb.auth.getSession().then(({ data: { session } }) => { if (session) showForm(); });
  setTimeout(() => { if (!ready) showProblem('This reset link is not valid. Ask the office for a new one.'); }, 6000);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.classList.remove('show');
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  if (p1.length < 10) { err.textContent = 'Use at least 10 characters.'; err.classList.add('show'); return; }
  if (p1 !== p2) { err.textContent = 'The two passwords do not match.'; err.classList.add('show'); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving...';
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) {
    err.textContent = error.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Save password';
    return;
  }
  await sb.auth.signOut();
  form.style.display = 'none';
  sub.textContent = '';
  document.getElementById('done').style.display = 'block';
});
</script>
</body>
</html>
